<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="register.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>
<body>
  <form id="registerForm">

    <a href="index.html" class="close-btn">
    <img src="img/cross 2.png" alt="Close" />
    </a>

    <h2>Create Account</h2>  
    <label>Email: <input id="registerEmail" name="email" type="email" required></label><br>
    <label>Password: <input id="registerPassword" name="password" type="password" required></label><br>
    <button type="submit">Register</button>
  </form>

  <script src="register.js"></script>
</body>
</html>
